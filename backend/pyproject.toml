[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "PhishGuard backend: real-time phishing detection API (MVC)"
requires-python = ">=3.11"
# Phase 0 needs only the web layer. Later phases add their own dependencies
# (SQLAlchemy/Alembic in Phase 5, ML libraries in Phase 3, and so on).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",  # required by FastAPI's TestClient
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["phishguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
