[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "PhishGuard backend: real-time phishing detection API (MVC)"
requires-python = ">=3.11"
# Each phase adds its own dependencies (ML libraries in Phase 3, and so on).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "tldextract>=5.4",  # host splitting for features, offline PSL snapshot
    "pyspellchecker>=0.9.1",  # F129, MIT, offline word frequency list
    "vaderSentiment>=3.3.2",  # F133, MIT, offline lexicon
    "httpx>=0.27",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# To load the trained models in the API. Same versions as training (ml/ `train` extra), because
# joblib files are only reliable with the versions that wrote them; change them together.
serve = [
    "numpy==2.4.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "xgboost==3.2.0",
    "lightgbm==4.7.0",
]
dev = [
    "numpy==2.4.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "pytest>=8.3",
    "httpx>=0.27",  # required by FastAPI's TestClient
    "ruff>=0.8",
    "fakeredis>=2.26",
]

[tool.setuptools.packages.find]
include = ["phishguard*"]

[tool.setuptools.package-data]
"phishguard.services.features" = ["data/*.txt", "data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests marked "postgres" need the docker compose Postgres; run them with `make test-db`.
addopts = "-q -m 'not postgres'"
markers = ["postgres: needs a running PostgreSQL (docker compose up postgres)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes long column definitions on one line.
"phishguard/db/migrations/versions/*.py" = ["E501"]
