# PhishGuard services. Copy .env.example to .env first.
# Later phases add: worker (Phase 5), dashboard (Phase 8).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      PHISHGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PHISHGUARD_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Data collection (Phase 1). Started only with `--profile collect`. ---
  # The only containers allowed to fetch phishing pages. They get no database or encryption
  # secrets, run as a non-root user with no Linux capabilities, and write only to ./data.
  snapshot:
    profiles: ["collect"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: ["snapshot"]
    environment: &collector-env
      PHISHGUARD_PHISHTANK_APP_KEY: ${PHISHGUARD_PHISHTANK_APP_KEY:-}
      PHISHGUARD_PHISHTANK_USERNAME: ${PHISHGUARD_PHISHTANK_USERNAME:-}
    volumes: ["./data:/data"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  collector:
    profiles: ["collect"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: ["collect"]
    environment: *collector-env
    volumes: ["./data:/data"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:
