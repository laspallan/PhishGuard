# PhishGuard services. Copy .env.example to .env first.
# Later phases add: worker (Phase 5), dashboard (Phase 8).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    networks: [default, evidence]
    # Not published: only the API and the evidence collector reach it, on the compose networks
    # (live_url_scanning.md, section 5.3). To run the API on the host instead, add
    # `-f docker-compose.yml -f docker-compose.dev.yml`, which publishes it on 127.0.0.1 only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    networks: [default, evidence]
    env_file: .env
    environment:
      PHISHGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PHISHGUARD_REDIS_URL: redis://redis:6379/0
      PHISHGUARD_DATA_DIR: /data
      PHISHGUARD_GOPHISH_URL: https://gophish:3333
      PHISHGUARD_GOPHISH_CA_FILE: /data/gophish/cert/gophish_admin.crt
    # Only the trained models and GoPhish's certificate (not its key), read-only: the API never
    # sees the stored phishing pages.
    volumes:
      - ./data/models:/data/models:ro
      - ./data/gophish/cert:/data/gophish/cert:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Data collection (Phase 1). Started only with `--profile collect`. ---
  # The only containers allowed to fetch phishing pages. They get no database or encryption
  # secrets, run as a non-root user with no Linux capabilities, and write only to ./data.
  snapshot:
    profiles: ["collect"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: ["snapshot"]
    environment: &collector-env
      PHISHGUARD_PHISHTANK_APP_KEY: ${PHISHGUARD_PHISHTANK_APP_KEY:-}
      PHISHGUARD_PHISHTANK_USERNAME: ${PHISHGUARD_PHISHTANK_USERNAME:-}
    volumes: ["./data:/data"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  collector:
    profiles: ["collect"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: ["collect"]
    environment: *collector-env
    volumes: ["./data:/data"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # --- Live scan evidence (Phase 5, decision D11). Started only with `--profile live`. ---
  # Same image and limits as the collectors, but it answers one URL at a time through Redis.
  # Its own network holds only Redis and the API, so it cannot reach Postgres; it has no secrets
  # and no volume, and its file system is read-only. No ports: it only takes jobs from Redis.
  evidence-collector:
    profiles: ["live"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: ["evidence-worker"]
    environment:
      PHISHGUARD_REDIS_URL: redis://redis:6379/0
    networks: [evidence]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # --- Simulations (Phase 6). Started only with `--profile simulate`. ---
  # Both ports stay on this PC. It can send nothing until a sending profile and campaign exist,
  # and campaigns.launch needs the ethics approval reference.
  gophish:
    profiles: ["simulate"]
    image: gophish/gophish:0.12.1
    ports:
      - "127.0.0.1:3333:3333"
      - "127.0.0.1:8088:80"
    # Our admin certificate (names gophish, localhost, 127.0.0.1), made by `make gophish-cert`.
    # GoPhish uses these files instead of making its own, which has no host name to check.
    volumes:
      - ./data/gophish/cert/gophish_admin.crt:/opt/gophish/gophish_admin.crt:ro
      - ./data/gophish/key/gophish_admin.key:/opt/gophish/gophish_admin.key:ro

  # --- Signature baseline (Phase 3, decision D2). Started only with `--profile baseline`. ---
  # No network at all; sees only data/baseline/ (the exported development emails).
  spamassassin:
    profiles: ["baseline"]
    build: ml/spamassassin
    network_mode: none
    volumes: ["./data/baseline:/work"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  evidence:

volumes:
  pgdata:
