[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-ml"
version = "0.1.0"
description = "PhishGuard offline pipeline: dataset, training, evaluation"
requires-python = ">=3.11"
# Also needs the local `phishguard` package from ../backend (install both, see README).
# It is not listed here on purpose: pip would otherwise try PyPI, where an unrelated
# package with the same name could be installed instead.
# Each Phase 1 step adds the libraries it needs.
dependencies = [
    "pyarrow>=17",
    "httpx>=0.27",
    "httpcore>=1.0",  # PinnedBackend (D11f)
    "tldextract>=5.4",
    "dnspython>=2.7",
    "cryptography>=43",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.11",  # McNemar (exact binomial test)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Phase 3 training (not needed by the snapshot / collector container). Newest releases that
# support Python 3.11 on this machine, checked 2026-11-03; licences MIT / Apache-2.0.
train = [
    "xgboost>=3.2",
    "lightgbm>=4.7",
    "optuna>=5.0",
    "shap>=0.51",
]
# D6: decoding brand favicons for the extension's reference hashes (Pillow 13.0.0, MIT-CMU,
# checked 2026-11-08). Only `brand-icons` needs it.
brand = [
    "pillow>=13.0",
]
# LSTM and CNN, installed in ml/.venv-text with the CPU build of PyTorch (see README).
text = [
    "torch>=2.15",
    "transformers>=5.22",  # DistilBERT prediction here; training runs on Colab
]

[tool.setuptools.packages.find]
include = ["phishguard_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["phishguard", "phishguard_ml"]
